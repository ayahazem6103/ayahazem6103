name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write

    steps:
      # Use the PAT for checkout so later git push can write to main
      # (repo/org "read-only" default GITHUB_TOKEN often causes Invalid status code: 1).
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Generate tokyonight theme
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: 3
          EXCLUDE: ""
          # Avoid the action's internal git push (flaky with two themes / stale tip).
          AUTO_PUSH: false
          THEME: "tokyonight"

      - name: Commit and push cards
        run: |
          git config user.email "profile-summary-cards-bot@example.com"
          git config user.name "profile-summary-cards[bot]"
          git add profile-summary-card-output
          if git diff --staged --quiet; then
            echo "No card changes to commit."
            exit 0
          fi
          git commit -m "Generate profile summary cards"
          git pull --rebase origin main
          git push origin HEAD:main
